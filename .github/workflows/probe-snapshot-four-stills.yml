name: Probe snapshot four stills

permissions:
  contents: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"

on:
  pull_request:
    paths:
      - .github/workflows/probe-snapshot-four-stills.yml

jobs:
  probe:
    name: ${{ matrix.name }}, Defender ${{ matrix.defender }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: main, defender: "off", ref: 85efaece7e11a3e420fb4d93b85230781e805942 }
          - { name: main, defender: "on", ref: 85efaece7e11a3e420fb4d93b85230781e805942 }
          - { name: fix, defender: "off", ref: d1fc64c7d8a3ac4797f656b0b18b31f1fe1fb222 }
          - { name: fix, defender: "on", ref: d1fc64c7d8a3ac4797f656b0b18b31f1fe1fb222 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.ref }}
      - uses: ./.github/actions/install-ffmpeg-windows
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile --linker=hoisted
        shell: pwsh
      - name: Build the CLI
        shell: pwsh
        run: |
          bun run --filter '@hyperframes/{parsers,lint,studio-server}' build
          bun run --cwd packages/core build
          bun run --filter @hyperframes/player build
          bun run --filter @hyperframes/studio build
          bun run --filter @hyperframes/inspector build
          bun run --filter @hyperframes/cli build
      - name: Install Chrome
        shell: pwsh
        run: node packages/cli/dist/cli.js browser ensure
      - name: Turn Defender's real-time protection on
        if: matrix.defender == 'on'
        shell: pwsh
        run: |
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
          if (Test-Path $policy) {
            Remove-Item "$policy\Real-Time Protection" -Recurse -Force -ErrorAction SilentlyContinue
            Remove-ItemProperty $policy -Name DisableAntiSpyware, DisableAntiVirus, DisableRealtimeMonitoring -ErrorAction SilentlyContinue
          }
          $excluded = (Get-MpPreference).ExclusionPath
          if ($excluded) { Remove-MpPreference -ExclusionPath $excluded -ErrorAction SilentlyContinue }
          try { Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction Stop } catch { "stays as it was: $($_.Exception.Message)" }
      - name: Time snapshot on four stills
        shell: pwsh
        run: |
          "Defender real-time protection: $((Get-MpComputerStatus).RealTimeProtectionEnabled)"
          $cli = "$env:GITHUB_WORKSPACE\packages\cli\dist\cli.js"
          "build ${{ matrix.name }} (${{ matrix.ref }}), Defender ${{ matrix.defender }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($kind in @(@{ n = "keyframes-every-2s"; g = 50; start = 0 }, @{ n = "one-keyframe"; g = 100000; start = 0 }, @{ n = "one-keyframe-far"; g = 100000; start = 150 })) {
            $dir = "$env:RUNNER_TEMP\$($kind.n)"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            ffmpeg -nostdin -v error -y -f lavfi -i "testsrc2=size=1920x1080:rate=25:duration=240" -c:v libx264 -preset ultrafast -g $($kind.g) -keyint_min $($kind.g) -sc_threshold 0 -pix_fmt yuv420p "$dir\rec.mp4"
            $html = '<!doctype html><html><head><meta charset="utf-8"></head><body><div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="60"><video id="v" class="clip" src="rec.mp4" muted playsinline data-start="0" data-duration="60" data-media-start="' + $kind.start + '" data-track-index="0" style="position:absolute;left:0;top:0;width:1920px;height:1080px"></video></div></body></html>'
            Set-Content -Path "$dir\index.html" -Value $html -Encoding utf8
            foreach ($run in 1, 2) {
              Remove-Item "$dir\out" -Recurse -Force -ErrorAction SilentlyContinue
              $sw = [Diagnostics.Stopwatch]::StartNew()
              $p = Start-Process node -ArgumentList $cli, "snapshot", "--at", "5,10,33,48", "--no-end", "--describe", "false", "-o", "$dir\out", "--json" -WorkingDirectory $dir -RedirectStandardOutput "$dir\o.json" -RedirectStandardError "$dir\e.txt" -PassThru -NoNewWindow
              $done = $p.WaitForExit(600000)
              $sw.Stop()
              if (-not $done) { Stop-Process -Id $p.Id -Force; $state = "TIMED OUT" } else { $state = "exit $($p.ExitCode)" }
              $line = "$($kind.n) run $run $state wall=$([math]::Round($sw.Elapsed.TotalSeconds, 1))s files=$((Get-ChildItem "$dir\out" -Filter *.png -ErrorAction SilentlyContinue).Count)"
              $line
              "- $line" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            }
          }
