name: Probe check on trimmed audio clips

permissions:
  contents: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"

on:
  pull_request:
    paths:
      - .github/workflows/probe-check-audio-clips.yml

jobs:
  probe:
    name: ${{ matrix.name }}, Defender ${{ matrix.defender }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: main, defender: "off", ref: 0e32ee9b56bd0815c0dc23a1c3fbb81aa8c43a87 }
          - { name: main, defender: "on", ref: 0e32ee9b56bd0815c0dc23a1c3fbb81aa8c43a87 }
          - { name: fix, defender: "off", ref: e0776ad8fda7b9fc8baa602bf5b207e5637849a3 }
          - { name: fix, defender: "on", ref: e0776ad8fda7b9fc8baa602bf5b207e5637849a3 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.ref }}
      - uses: ./.github/actions/install-ffmpeg-windows
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile --linker=hoisted
        shell: pwsh
      - name: Build the CLI
        shell: pwsh
        run: |
          bun run --filter '@hyperframes/{parsers,lint,studio-server}' build
          bun run --cwd packages/core build
          bun run --filter @hyperframes/player build
          bun run --filter @hyperframes/studio build
          bun run --filter @hyperframes/inspector build
          bun run --filter @hyperframes/cli build
      - name: Install Chrome
        shell: pwsh
        run: node packages/cli/dist/cli.js browser ensure
      - name: Turn Defender's real-time protection on
        if: matrix.defender == 'on'
        shell: pwsh
        run: |
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
          if (Test-Path $policy) {
            Remove-Item "$policy\Real-Time Protection" -Recurse -Force -ErrorAction SilentlyContinue
            Remove-ItemProperty $policy -Name DisableAntiSpyware, DisableAntiVirus, DisableRealtimeMonitoring -ErrorAction SilentlyContinue
          }
          $excluded = (Get-MpPreference).ExclusionPath
          if ($excluded) { Remove-MpPreference -ExclusionPath $excluded -ErrorAction SilentlyContinue }
          try { Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction Stop } catch { "stays as it was: $($_.Exception.Message)" }
      - name: Time check --json on trimmed clips
        shell: pwsh
        run: |
          "Defender real-time protection: $((Get-MpComputerStatus).RealTimeProtectionEnabled)"
          $cli = "$env:GITHUB_WORKSPACE\packages\cli\dist\cli.js"
          "build ${{ matrix.name }} (${{ matrix.ref }}), Defender ${{ matrix.defender }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($n in 30, 100, 300, 300) {
            $dir = "$env:RUNNER_TEMP\clips-$n"
            if (-not (Test-Path $dir)) {
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              ffmpeg -v error -y -f lavfi -i "sine=frequency=440:duration=60" -c:a pcm_s16le "$dir\a.wav"
              $tags = for ($i = 0; $i -lt $n; $i++) {
                $s = ($i * 2) % 58
                "<audio class=`"clip`" src=`"a.wav`" data-start=`"$s`" data-duration=`"1.5`" data-media-start=`"$($i % 50)`" data-track-index=`"$($i % 8 + 1)`" data-volume=`"0.5`"></audio>"
              }
              $html = '<!doctype html><html><head><meta charset="utf-8"></head><body><div id="root" data-composition-id="main" data-width="640" data-height="360" data-start="0" data-duration="60">' + ($tags -join "`n") + '<div class="clip" data-start="0" data-duration="60" data-track-index="0" style="color:#fff">HyperFrames</div></div></body></html>'
              Set-Content -Path "$dir\index.html" -Value $html -Encoding utf8
            }
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process node -ArgumentList $cli, "check", "--json" -WorkingDirectory $dir -RedirectStandardOutput "$dir\out.json" -RedirectStandardError "$dir\err.txt" -PassThru -NoNewWindow
            $done = $p.WaitForExit(900000)
            $sw.Stop()
            if (-not $done) { Stop-Process -Id $p.Id -Force; $state = "TIMED OUT" } else { $state = "exit $($p.ExitCode)" }
            $line = "clips=$n $state wall=$([math]::Round($sw.Elapsed.TotalSeconds, 1))s out=$((Get-Item "$dir\out.json").Length) bytes"
            $line
            "- $line" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
