name: Windows low temp disk probe

permissions:
  contents: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"

on:
  pull_request:
    paths:
      - .github/workflows/windows-low-temp-probe.yml
  workflow_dispatch:

jobs:
  probe:
    name: A render with TEMP on a nearly full drive
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/install-ffmpeg-windows
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile --linker=hoisted
        shell: pwsh
      - name: Build the CLI
        shell: pwsh
        run: |
          bun run --filter '@hyperframes/{parsers,lint,studio-server}' build
          bun run --cwd packages/core build
          bun run --filter @hyperframes/player build
          bun run --filter @hyperframes/studio build
          bun run --filter @hyperframes/inspector build
          bun run --filter @hyperframes/cli build
      - name: Make a small drive and a video project
        shell: pwsh
        run: |
          $vhd = "$env:RUNNER_TEMP\small.vhdx"
          @"
          create vdisk file="$vhd" maximum=1200 type=fixed
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          format fs=ntfs quick label=SMALL
          assign letter=S
          "@ | Set-Content "$env:RUNNER_TEMP\diskpart.txt"
          diskpart /s "$env:RUNNER_TEMP\diskpart.txt"
          Get-PSDrive S | Format-List Used, Free
          $project = "$env:RUNNER_TEMP\video-project"
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Set-Location $project
          ffmpeg -y -f lavfi -i "testsrc2=size=1920x1080:rate=30:duration=180" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 30 1.mp4
          @'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <style>
                html, body { margin: 0; padding: 0; background: #000; }
                #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
                video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
              </style>
            </head>
            <body>
              <div id="root" data-composition-id="root" data-start="0" data-duration="180" data-width="1920" data-height="1080">
                <video id="v" src="1.mp4" data-start="0" muted data-duration="180" data-track-index="0" data-media-start="0"></video>
              </div>
              <script>window.__timelines = window.__timelines || {};</script>
            </body>
          </html>
          '@ | Set-Content -Path index.html -Encoding utf8
      - name: Render with TEMP on the small drive
        shell: pwsh
        run: |
          $cli = "$env:GITHUB_WORKSPACE\packages\cli\dist\cli.js"
          Set-Location "$env:RUNNER_TEMP\video-project"
          node $cli browser ensure
          New-Item -ItemType Directory -Force -Path S:\tmp | Out-Null
          $variants = @(
            @{ Name = 'workers 1, --gpu'; Args = @('--workers', '1', '--gpu') },
            @{ Name = 'workers 1, --gpu, fast capture off'; Args = @('--workers', '1', '--gpu', '--experimental-fast-capture=false') }
          )
          foreach ($v in $variants) {
            Write-Host "=== $($v.Name)"
            Get-ChildItem S:\tmp -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            $env:TEMP = 'S:\tmp'; $env:TMP = 'S:\tmp'
            $log = "$env:RUNNER_TEMP\render.log"
            $p = Start-Process -FilePath node -ArgumentList (@($cli, 'render', '--fps', '30', '--quality', 'draft') + $v.Args + @('--output', 'renders\probe.mp4')) -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru -WindowStyle Hidden
            $peak = 0
            $deadline = (Get-Date).AddMinutes(7)
            while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
              $used = [math]::Round(((Get-PSDrive S).Used) / 1MB)
              if ($used -gt $peak) { $peak = $used }
              Start-Sleep -Milliseconds 500
            }
            if (-not $p.HasExited) { Write-Host 'still running after 7 minutes; stopping it'; Stop-Process -Id $p.Id -Force }
            Write-Host "exit=$($p.ExitCode) peak used on S: $peak MB, free now $([math]::Round((Get-PSDrive S).Free / 1MB)) MB"
            Get-Content $log, "$log.err" | Where-Object { $_ -match 'ENOENT|ENOSPC|rror|rame|space' } | Select-Object -Last 20 | ForEach-Object { Write-Host "    | $_" }
          }
